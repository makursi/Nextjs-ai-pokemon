packages:
  - apps/*
  - packages/*

# Build scripts pnpm is allowed to run on install.
allowBuilds:
  simple-git-hooks: true

# Versions shared by more than one package, plus the repo toolchain, live here.
# Packages reference them with the `catalog:` protocol; single-consumer
# dependencies use literal ranges in their own package.json.
#
# `typescript` and `oxlint-tsgolint` are pinned exactly: tsgolint tracks a specific
# TypeScript release (7.0.2001 <=> TS 7.0.2), so both must move together.
catalog:
  "@tailwindcss/postcss": ^4.3.3
  "@types/node": ^24.13.4
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  lint-staged: ^17.5.1
  next: ^16.3.5
  oxfmt: 0.67.0
  oxlint: 1.82.0
  oxlint-tsgolint: 7.0.2001
  react: ^19.3.0
  react-dom: ^19.3.0
  simple-git-hooks: ^2.14.0
  tailwindcss: ^4.3.3
  turbo: 2.10.12
  typescript: 7.0.2
  # vite is a required peer of vitest, so the two are versioned together.
  vite: ^8.3.0
  vitest: ^5.0.0

# pnpm's minimum-release-age supply-chain policy rejects versions published
# inside its cutoff window. tailwind-merge 3.7.0 was roughly ten hours old when
# this workspace was created, so pnpm wrote this exclusion itself. Keep it: a
# caret range would resolve straight back into the freshly published version and
# fail the policy again. It becomes a no-op once the release ages past the
# cutoff, and can then be deleted.
minimumReleaseAgeExclude:
  - tailwind-merge@3.7.0
